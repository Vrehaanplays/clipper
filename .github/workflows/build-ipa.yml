name: Build unsigned IPA

# Builds the three Clipper targets (app, widget extension, unit tests), runs the test
# suite on a simulator, and produces an UNSIGNED Clipper.ipa as a downloadable artifact.
#
# AltStore does the signing on your side with your own Apple ID, so no certificates,
# no provisioning profiles and no secrets are needed here.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Clipper.xcodeproj
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project Clipper.xcodeproj

      - name: Choose a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(python3 .github/scripts/pick-simulator.py)
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the test suite on a simulator
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Clipper.xcodeproj \
            -scheme Clipper \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-tests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            test 2>&1 | tee xcodebuild-test.log

      # The perf tests print their measured numbers; surface them in the job summary so
      # docs/PERFORMANCE.md can quote real figures instead of guesses.
      - name: Report measured performance
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Measured performance'
            echo '```'
            grep -h '\[perf\]' xcodebuild-test.log || echo 'no [perf] lines captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clipper-test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build (unsigned, Release, device)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Clipper.xcodeproj \
            -scheme Clipper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package into an IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Clipper.app"
          test -d "$APP" || { echo "No .app produced"; exit 1; }
          # An IPA is just a zip with the app inside a top-level Payload/ folder.
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          rm -f Clipper.ipa
          zip -qry Clipper.ipa Payload
          unzip -l Clipper.ipa | head -40
          ls -lh Clipper.ipa

      - name: Sanity-check the bundle
        run: |
          set -euo pipefail
          APP="Payload/Clipper.app"
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST"

          # The widget extension must be embedded, or there is no Home Screen widget and
          # no Live Activity UI at all.
          WIDGET="$APP/PlugIns/ClipperWidgets.appex"
          test -d "$WIDGET" || { echo "Widget extension is missing from the bundle"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WIDGET/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET/Info.plist"
          echo "Widget extension embedded OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Clipper-v2-unsigned-ipa
          path: Clipper.ipa
          if-no-files-found: error
          retention-days: 30
