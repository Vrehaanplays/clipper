# XcodeGen manifest — this file IS the project.
#
# `Clipper.xcodeproj` is generated from it (`xcodegen generate`) rather than being
# committed, because a hand-edited .pbxproj is the one file that cannot be safely
# maintained without Xcode. The CI job regenerates it on every build.

name: Clipper

options:
  bundleIdPrefix: com.vrehaanplays
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode: the recorder uses queue-based concurrency deliberately
    # (real-time audio callbacks and a serial control queue), not actors.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_BITCODE: "NO"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: "YES"

targets:
  Clipper:
    type: application
    platform: iOS
    sources:
      - path: Clipper
        # Info.plist is referenced via INFOPLIST_FILE; it must not also be copied
        # into the bundle as a resource.
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Clipper
        # Change this to something personal before sideloading, e.g. com.yourname.clipper.
        PRODUCT_BUNDLE_IDENTIFIER: com.vrehaanplays.clipper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Clipper/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # No entitlements file on purpose. Background audio is an Info.plist key, not an
        # entitlement, so nothing here needs a paid developer account — which is what
        # lets AltStore re-sign the app with a free Apple ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Clipper:
    build:
      targets:
        Clipper: all
    run:
      config: Debug
    archive:
      config: Release
